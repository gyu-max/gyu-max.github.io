        const rr = prng(29); for (let i = 0; i < 70; i++) { const x = Math.floor(rr() * LW), y = Math.floor(rr() * h); R(x, y, 3, 2, rr() < 0.5 ? C.t : C.i); }
        ell(90, cy, 84, Math.min(h / 2 - 8, 150), C.t); ell(90, cy, 78, Math.min(h / 2 - 14, 144), C.i);
        const r2 = prng(30); for (let i = 0; i < 60; i++) P(14 + Math.floor(r2() * 152), cy - 100 + Math.floor(r2() * 200), C.G);
        ell(90, 6, 30, 8, C.G); ell(90, 5, 26, 6, C.g); circ(90, 6, 3, C.r);
      }), 0, 17);
      alpha(0.08 + p * 0.25, () => ell(c.x, c.y, 70, 50, p > 0.85 ? C.y : C.c));
      // Daniel praying (6:10)
      alpha(0.25 + Math.sin(t * 2) * 0.08, () => circ(c.x, c.y - 8, 16, C.Y));
      spr(SPR.danielK, c.x - 12, c.y - 26, false, 2);
      for (const l of lions) {
        const s = l.state === 'leap' ? 2 + clamp(l.st / Q.leap, 0, 1) * 0.6 : 2;
        const im = l.state === 'rise' || l.state === 'leap' ? SPR.lionOpen : l.state === 'shut' || l.state === 'rest' ? SPR.lionZ : SPR.lion;
        const shake = l.state === 'rise' ? Math.round(Math.sin(l.st * 50)) : 0;
        X.drawImage(im, Math.round(l.x - (im.width * s) / 2 + shake), Math.round(l.y - (im.height * s) / 2), Math.round(im.width * s), Math.round(im.height * s));
        if (l.state === 'rise') { const blink = Math.floor(t * 10) % 2; if (blink) TO('!', l.x, l.y - 26, C.r, 11, 'c'); }
        if (l.state === 'shut' && l.st < 0.6) { alpha(1 - l.st / 0.6, () => spr(SPR.angel, l.x - 12, l.y - 40, false, 2)); }
        if (l.state === 'rest' && Math.floor((t + l.k) * 1.5) % 4 === 0) T('z', l.x + 12, l.y - 18, C.g, 7);
      }
      if (done) TO('아침이 되었어요', LW / 2, LH - 24, C.Y, 9, 'c');
      if (state === 'ready' || (state === 'play' && time < 3)) TO('일어나는 사자 쪽으로 밀거나 눌러요', LW / 2, LH - 16, C.w, 7, 'c');

      T(p < 0.85 ? '밤' : '새벽', 5, 3, C.Y, 9);
      gauge(28, 6, 70, 4, p, C.v);
      for (let i = 0; i < 3; i++) spr(i < hearts ? SPR.heart : SPR.heartOff, 130 + i * 10, 4);
    }
  };
}

// ===================== 소선지서 1. 요엘의 메뚜기 (요엘 1–2장) =====================
// Swarms come down from the north onto the fields (1:4, 2:20). Swipe to raise a wind and drive them off before they settle.
// When the time is up the rain comes and the eaten years are given back (2:23-25).
function makeJoel(diff) {
  const HARD = diff === 'h';
  const Q = HARD
    ? { dur: 36, gap: [1.5, 2.2], speed: 30, eat: 0.2, big: 0.35 }
    : { dur: 32, gap: [2.3, 3.1], speed: 24, eat: 0.17, big: 0 };
  const COLS = 4, ROWS = 3;
  let t, time, nextT, patches, swarms, strokes, trail, phase, endT, hpEnd, driven, autoT = 0;
  const fieldTop = () => Math.round(LH * 0.46);
  function patchRect(i) {
    const c = i % COLS, r = Math.floor(i / COLS), top = fieldTop(), w = (LW - 12) / COLS, h = (LH - 6 - top) / ROWS;
    return { x: 6 + c * w, y: top + r * h, w, h, cx: 6 + c * w + w / 2, cy: top + r * h + h / 2 };
  }
  const health = () => patches.reduce((a, p) => a + p, 0) / patches.length;
  function nearestPatch(x, y) {
    let best = -1, bd = 1e9;
    patches.forEach((hp, i) => { if (hp <= 0.02) return; const r = patchRect(i), d = Math.hypot(r.cx - x, r.cy - y) + rand(0, 24); if (d < bd) { bd = d; best = i; } });
    return best;
  }
  function makeSwarm(x, y, n, r) {
    const s = { x, y, vx: 0, vy: 0, n, r, big: false, cool: 0, eating: false, target: -1, bugs: [] };
    for (let k = 0; k < n; k++) s.bugs.push({ a: rand(0, 6.28), d: 0.25 + Math.sqrt(Math.random()) * 0.75, ph: rand(0, 6.28), sp: rand(1.5, 3.5) * (Math.random() < 0.5 ? -1 : 1) });
    s.target = nearestPatch(x, y + 80);
    return s;
  }
  function spawn() {
    const big = Math.random() < Q.big;
    const s = makeSwarm(rand(24, LW - 24), -6, big ? 26 : randi(11, 16), big ? 17 : 12);
    s.big = big; swarms.push(s);
  }
  function blow(x0, y0, x1, y1, speed) {
    const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy); if (L < 1) return;
    const ux = dx / L, uy = dy / L, push = Math.min(260, speed * 0.85);
    let hit = false;
    for (const s of [...swarms]) {
      const k = clamp(((s.x - x0) * ux + (s.y - y0) * uy) / L, 0, 1), px = x0 + ux * L * k, py = y0 + uy * L * k;
      if (Math.hypot(s.x - px, s.y - py) > s.r + 3) continue;
      hit = true;
      if (s.big) { // a great army breaks in two the first time the wind hits it
        swarms.splice(swarms.indexOf(s), 1);
        for (const sg of [-0.6, 0.6]) {
          const h = makeSwarm(s.x + sg * 8, s.y, s.n >> 1, 12), c = Math.cos(sg), sn = Math.sin(sg);
          h.vx = (ux * c - uy * sn) * push * 0.5; h.vy = (ux * sn + uy * c) * push * 0.5; h.cool = 0.8; swarms.push(h);
        }
        FX.float('큰 떼가 갈라졌어요', s.x, s.y - 16, C.w, 7, 0.7);
        continue;
      }
      s.vx = ux * push; s.vy = uy * push; s.cool = 1.1; s.eating = false;
    }
    if (hit) sfx('whirl');
  }

  // ---------- art ----------
  function drawSky() {
    const top = fieldTop(), bugs = swarms.reduce((a, s) => a + s.n, 0), dark = phase === 'play' ? Math.min(0.55, bugs / 90) : 0;
    vgrad(0, 17, LW, top - 17, [[0, mixHex(C.c, C.G, dark)], [1, mixHex(C.w, C.g, dark)]]);
    // hills of Zion with Joel blowing the trumpet (2:1)
    for (let x = 0; x < LW; x++) { const h = Math.round(7 + Math.sin(x * 0.045 + 0.6) * 4 + Math.sin(x * 0.13) * 1.5); R(x, top - h, 1, h, mixHex(C.l, C.L, 0.5)); }
    spr(SPR.joel, 6, top - 7 - 32, false, 2);
    line(30, top - 26, 37, top - 30, C.y); R(37, top - 32, 2, 4, C.y);
  }
  function drawField() {
    const top = fieldTop();
    R(0, top, LW, LH - top, C.B);
    patches.forEach((hp, i) => {
      const r = patchRect(i), x0 = Math.round(r.x) + 1, y0 = Math.round(r.y) + 1, w = Math.round(r.w) - 2, h = Math.round(r.h) - 2;
      R(x0, y0, w, h, mixHex(C.b, C.L, hp));
      const tall = Math.round((h - 3) * (0.25 + hp * 0.75));
      for (let x = x0 + 2; x < x0 + w - 1; x += 3) {
        const sway = phase === 'play' ? Math.round(Math.sin(t * 2 + x * 0.3) * 0.6) : 0, hh = Math.max(1, tall - ((x * 7) % 3));
        R(x + sway, y0 + h - hh, 1, hh, hp > 0.5 ? C.l : hp > 0.2 ? C.y : C.N);
        if (hp > 0.6) P(x + sway, y0 + h - hh, C.y);
      }
    });
  }
  function drawSwarm(s) {
    if (s.eating) alpha(0.25, () => ell(s.x, s.y + 4, s.r, Math.max(2, s.r * 0.35), C.k));
    for (const b of s.bugs) {
      const a = b.a + t * b.sp, x = Math.round(s.x + Math.cos(a) * b.d * s.r), y = Math.round(s.y + Math.sin(a) * b.d * s.r * 0.7);
      R(x, y, 2, 1, C.k); P(x + 2, y, C.L); P(x + (b.sp > 0 ? 2 : -1), y + 1, C.k);
      if (Math.sin(t * 30 + b.ph) > 0) R(x, y - 1, 2, 1, C.g);
    }
  }

  return {
    init() {
      t = 0; time = 0; nextT = 0.6; patches = Array(COLS * ROWS).fill(1); swarms = []; strokes = new Map(); trail = [];
      phase = 'play'; endT = 0; hpEnd = 1; driven = 0;
    },
    anim(dt) {
      t += dt;
      for (const tr of trail) tr.life -= dt;
      trail = trail.filter(tr => tr.life > 0);
    },
    idle(dt) { this.anim(dt); },
    update(dt) {
      this.anim(dt);
      if (phase !== 'play') {
        endT += dt;
        for (const s of swarms) { s.y -= 160 * dt; s.x += Math.sin(t + s.n) * 20 * dt; }
        swarms = swarms.filter(s => s.y > -30);
        if (phase === 'wind' && endT > 1.2) {
          phase = 'rain'; endT = 0; sfx('splash');
          FX.float('이른 비와 늦은 비가 내려요', LW / 2, 30, C.w, 7, 1.6);
        }
        if (phase === 'rain') {
          for (let k = 0; k < 4; k++) FX.part({ x: rand(0, LW), y: rand(17, 30), vx: -10, vy: 190, life: 0.9, c: C.c });
          for (let i = 0; i < patches.length; i++) patches[i] = Math.min(1, patches[i] + dt * 0.8);
          if (endT > 0.9 && endT - dt <= 0.9) FX.float('먹은 햇수대로 갚아 주셨어요', LW / 2, fieldTop() - 30, C.Y, 7, 1.6);
          if (endT > 2.6) {
            const stars = hpEnd >= 0.9 ? 3 : hpEnd >= 0.72 ? 2 : 1;
            Shell.finish(true, stars, `밭의 ${Math.round(hpEnd * 100)}%를 지켰어요 · 메뚜기 떼 ${driven}무리를 몰아냈어요`);
          }
        }
        return;
      }
      time += dt;
      if (AUTO && (autoT -= dt) <= 0) {
        autoT = 0.14;
        const s = swarms.filter(q => q.y > 22 && q.cool <= 0).sort((a, b) => b.y - a.y)[0];
        if (s) blow(s.x, s.y + 18, s.x + (s.x < LW / 2 ? -12 : 12), s.y - 28, 520);
      }
      nextT -= dt;
      if (nextT <= 0 && time < Q.dur - 3) { spawn(); nextT = rand(Q.gap[0], Q.gap[1]) * lerp(1, 0.75, time / Q.dur); }
      for (const s of swarms) {
        if (s.cool > 0) {
          s.cool -= dt; s.x += s.vx * dt; s.y += s.vy * dt;
          const f = Math.pow(0.3, dt); s.vx *= f; s.vy *= f;
          if (s.cool <= 0) s.target = nearestPatch(s.x, s.y);
        } else {
          if (s.target < 0 || patches[s.target] <= 0.02) { s.target = nearestPatch(s.x, s.y); s.eating = false; }
          if (s.target >= 0) {
            const r = patchRect(s.target), dx = r.cx - s.x, dy = r.cy - s.y, d = Math.hypot(dx, dy);
            if (d > 5) { const v = Q.speed * (s.eating ? 0.35 : 1); s.x += (dx / d) * v * dt + Math.sin(t * 2.3 + s.n) * 5 * dt; s.y += (dy / d) * v * dt; }
            s.eating = d < 12;
            if (s.eating) patches[s.target] = Math.max(0, patches[s.target] - Q.eat * dt * (s.n / 12));
          }
        }
        if (s.x < -26 || s.x > LW + 26 || s.y < -22 || s.y > LH + 26) { s.gone = true; driven++; FX.float('훨훨', clamp(s.x, 20, LW - 20), clamp(s.y, 26, LH - 10), C.w, 7, 0.5); }
      }
      swarms = swarms.filter(s => !s.gone);
      if (health() < (HARD ? 0.45 : 0.35)) { Shell.finish(false, 0, '메뚜기가 밭을 너무 많이 먹었어요'); return; }
      if (time >= Q.dur) {
        phase = 'wind'; endT = 0; hpEnd = health(); sfx('whirl'); sfx('flash');
        FX.float('북쪽에서 온 떼를 멀리 쫓아내셨어요', LW / 2, 30, C.Y, 7, 1.4);
      }
    },
    pointerDown(x, y, id) { strokes.set(id, { x, y, t }); },
    pointerMove(x, y, id) {
      const s = strokes.get(id); if (!s || phase !== 'play') return;

// ===================== 소선지서 2. 아모스의 다림줄 (아모스 7장) =====================

  return {

    update(dt) {

// ===================== 소선지서 3. 요나와 큰 물고기 (요나 1–2장) =====================
// Ported from 성경 이야기 모음집 with two difficulties: hard has narrower gaps, a faster current and rocks that rise and fall.
function makeJonah(diff) {
  const HARD = diff === 'h';
  const Q = HARD ? { spd: 60, gap: [84, 64], sway: 7 } : { spd: 52, gap: [94, 74], sway: 0 };

  }
  function spawn() {
    const k = run / TOTAL, gh = Math.round(lerp(Q.gap[0], Q.gap[1], k));
    const lo = top() + 14 + Q.sway + gh / 2, hi = bot() - 14 - Q.sway - gh / 2;
    let c = clamp(lastGap + rand(-62, 62), lo, hi);
    if (Math.abs(c - lastGap) < 14) c = clamp(c + (Math.random() < 0.5 ? -24 : 24), lo, hi);
    lastGap = c;
    const w = 15, seed = rand(0, 9), tb = Math.round(c - gh / 2), rh = Math.max(4, tb - top() + 2 + Q.sway);
    const rock = paintCanvas(w + 2, rh, () => {
      for (let y = 0; y < rh; y++) {
        const tip = Math.max(0, y - (rh - 9));
        const il = Math.round(Math.abs(Math.sin(y * 0.45 + seed)) * 2 + tip * 0.75), ir = Math.round(Math.abs(Math.sin(y * 0.37 + seed * 2)) * 2 + tip * 0.75);
        const x0 = 1 + il, x1 = w + 1 - ir;
        if (x1 - x0 < 1) continue;
        R(x0, y, x1 - x0, 1, C.G); P(x0 + 1, y, C.g); P(x0, y, C.k); P(x1 - 1, y, C.k);
        if (Math.floor(y + seed * 3) % 11 === 0 && x1 - x0 > 7) R(x0 + 3, y, x1 - x0 - 6, 1, C.i);
      }
    });
    gates.push({ x: LW + 8, w, c0: c, gh, rock, sway: rand(0, 6) });
  }
  const gc = g => g.c0 + (Q.sway ? Math.sin(t * 1.3 + g.sway) * Q.sway : 0); // the gap centre right now
  function hitGate(g) {
    const fx0 = FX0 - 12, fx1 = FX0 + 12, fy0 = fy - 5, fy1 = fy + 5;
    if (fx1 < g.x || fx0 > g.x + g.w) return false;
    return fy0 < gc(g) - g.gh / 2 || fy1 > gc(g) + g.gh / 2;
  }
  const holding = () => pointers.size > 0 || keyHold > 0;

  return {
    init() {
      t = 0; run = 0; fy = Math.round((top() + bot()) / 2); vy = 0; keyHold = 0; hearts = 3; inv = 0; gates = []; dist = 0; nextGate = 60; lastGap = fy;
      ending = false; endT = 0; bubT = 0; phaseShown = -1; phasePop = 0; spat = false; landed = false;
      plank = Array.from({ length: 28 }, () => ({ x: rand(0, LW), y: rand(0, 1), p: rand(0, 6), v: rand(4, 12) }));
    },
    idle(dt) { t += dt; for (const p of plank) { p.x -= p.v * dt; if (p.x < -2) p.x = LW + 2; } },
    update(dt) {

        if (AUTO) { const g = gates.find(q => q.x + q.w > FX0 - 14); const target = g ? gc(g) : (top() + bot()) / 2; keyHold = fy + vy * 0.12 > target ? 1 : 0; }

        fy += vy * dt;
        if (fy < top() + 9) { fy = top() + 9; vy = Math.max(0, vy); }
        if (fy > bot() - 9) { fy = bot() - 9; vy = Math.min(0, vy); }
        dist += SPD * dt;
        for (const g of gates) g.x -= SPD * dt;
        gates = gates.filter(g => g.x > -24);
        if (run < TOTAL - 2.7 && dist >= nextGate) { spawn(); nextGate = dist + rand(92, 110); }
        if (inv > 0) inv -= dt;
        else for (const g of gates) if (hitGate(g)) {
          hearts--; inv = 1.4; sfx('hit'); FX.shake(3, 0.3); FX.burst(FX0 + 8, fy, [C.c, C.w], 10, 50, -20);
          if (hearts <= 0) { Shell.finish(false, 0, '바위와 바다풀에 너무 많이 부딪혔어요'); return; }
          break;
        }
        bubT -= dt; if (bubT <= 0) { bubT = holding() ? 0.25 : 0.6; FX.part({ x: FX0 + 15, y: fy + 1, vx: -14, vy: -22, life: 1.1, c: C.c }); }
        const idx = Math.min(5, Math.floor(run / 5));
        if (idx !== phaseShown) { phaseShown = idx; phasePop = 1.6; if (idx > 0) sfx('bubble'); }
        phasePop = Math.max(0, phasePop - dt);
        if (run >= TOTAL && gates.every(g => g.x + g.w < FX0 - 16)) { ending = true; endT = 0; sfx('splash'); }
      } else {
        const before = endT; endT += dt;
        if (before < 1.8 && endT >= 1.8) { spat = true; sfx('jump'); }
        if (before < 2.7 && endT >= 2.7) { landed = true; sfx('thud'); FX.burst(150, this.beachY() - 10, [C.n, C.N], 8, 30, 120, 0.5); FX.float('육지다!', 150, this.beachY() - 40, C.Y, 9, 1.2); }
        if (endT > 4.0) Shell.finish(true, hearts, hearts === 3 ? '한 번도 부딪히지 않고 사흘 밤낮을 버텼어요' : `남은 하트 ${hearts}개로 사흘 밤낮을 버텼어요`);
      }
    },
    beachY() { return Math.round(LH * 0.5) + 4; },
    pointerDown() { /* holding is read from active pointers */ },
    keyDown(k) { if (k === ' ' || k === 'ArrowUp' || k === 'Enter') { keyHold = 1; return true; } return false; },
    keyUp(k) { if (k === ' ' || k === 'ArrowUp' || k === 'Enter') keyHold = 0; },
    release() { keyHold = 0; },
    drawSea() {

    },

      for (const [dx, dy] of [[-8, 3], [-6, -3], [6, -3], [8, 3], [0, -5]]) line(168, sea - 29, 168 + dx, sea - 29 + dy, C.L);

// ===================== 소선지서 4. 하박국의 파수대 (하박국 2–3장) =====================
// Climb the high places to the watchtower (2:1, 3:19): tap the side where the next step is before your breath runs out.
function makeHabakkuk(diff) {
  const HARD = diff === 'h';
  const Q = HARD ? { n: 60, drain: [0.1, 0.16], refill: 0.05, slip: 0.15, back: 1 } : { n: 40, drain: [0.06, 0.1], refill: 0.06, slip: 0.12, back: 0 };
  const SW = 16, SH = 12;
  const SIGNS = [[0.25, 'fig', '무화과나무에 열매가 없어도'], [0.5, 'vine', '포도나무에 열매가 없어도'], [0.75, 'fold', '우리에 양이 없어도']];
  let t, steps, k, hop, queue, breath, slips, streak, cam, phase, endT, stumble, deer, shown, autoT = 0;

  function build() {
    steps = [{ x: 90, y: 0, dir: 0 }];
    let x = 90, dir = Math.random() < 0.5 ? -1 : 1;
    for (let i = 1; i <= Q.n; i++) {
      if (Math.random() < 0.45) dir = -dir;
      if (x + dir * SW < 22 || x + dir * SW > LW - 22) dir = -dir;
      x += dir * SW; steps.push({ x, y: -i * SH, dir });
    }
  }
  const baseY = () => Math.round(LH * 0.7);
  const sy = wy => Math.round(baseY() + wy - cam);
  function step(dir) {
    if (phase !== 'climb' || stumble > 0) return;
    if (hop) { if (queue.length < 2) queue.push(dir); return; }
    const nx = steps[k + 1];
    if (!nx) return;
    if (nx.dir === dir) {
      hop = { from: k, t: 0 }; k++; streak++;
      breath = Math.min(1, breath + Q.refill); sfx('jump');
      if (streak > 0 && streak % 10 === 0) { deer = { t: 0, y: steps[k].y, dir: dir }; FX.float('사슴처럼!', steps[k].x, sy(steps[k].y) - 40, C.Y, 7, 0.8); }
      for (const [f, id, text] of SIGNS) if (!shown[id] && k >= Math.round(Q.n * f)) { shown[id] = true; FX.float(text, LW / 2, 30, C.w, 7, 1.4); }
    } else {
      slips++; streak = 0; breath = Math.max(0, breath - Q.slip); stumble = 0.3; queue.length = 0;
      if (Q.back && k > 0) { hop = { from: k, t: 0 }; k -= Q.back; }
      sfx('bad'); FX.shake(2, 0.2); FX.float('미끄러졌어요', steps[k].x, sy(steps[k].y) - 38, C.r, 7, 0.6);
    }
  }

  // ---------- art ----------
  function drawBack() {
    X.drawImage(layer('hab-bg', LW, LH - 17, () => {
      const h = LH - 17;
      vgrad(0, 0, LW, h, [[0, C.E], [0.55, C.e], [1, C.c]]);
      for (let x = 0; x < LW; x++) { const m = Math.round(h * 0.45 + Math.sin(x * 0.035 + 1) * 26 + Math.sin(x * 0.11) * 6); R(x, m, 1, h - m, C.i); }
      for (let x = 0; x < LW; x++) { const m = Math.round(h * 0.62 + Math.sin(x * 0.05 + 3) * 18 + Math.sin(x * 0.17) * 4); R(x, m, 1, h - m, C.t); }
    }), 0, 17);
    // a few rocks on the slope drift by as you climb
    const off = ((Math.round(-cam * 0.5) % 40) + 40) % 40;
    for (let y = 17 - 40 + off, i = 0; y < LH; y += 40, i++) { const x = (i * 67 + Math.floor(cam / 40) * 31) % 150 + 15; R(x, y, 5, 3, C.t); P(x + 1, y, C.i); }
  }
  function drawSign(id, x, y) {
    if (id === 'fig') { line(x, y, x, y - 14, C.B); line(x, y - 9, x - 6, y - 15, C.B); line(x, y - 11, x + 5, y - 17, C.B); line(x - 6, y - 15, x - 8, y - 14, C.B); }
    if (id === 'vine') { R(x - 7, y - 14, 1, 14, C.b); R(x + 6, y - 14, 1, 14, C.b); R(x - 7, y - 14, 14, 1, C.b); line(x - 6, y - 12, x + 5, y - 3, C.B); line(x - 6, y - 4, x + 5, y - 12, C.B); }
    if (id === 'fold') { for (let i = 0; i < 4; i++) R(x - 9 + i * 6, y - 9, 2, 9, C.b); R(x - 9, y - 7, 20, 1, C.b); R(x - 9, y - 3, 20, 1, C.b); }
  }
  function drawSteps() {
    for (let i = 0; i < steps.length; i++) {
      const s = steps[i], y = sy(s.y); if (y < 10 || y > LH + 8) continue;
      R(s.x - 9, y, 18, 5, C.k); R(s.x - 8, y, 16, 3, i <= k ? C.n : C.g); R(s.x - 8, y + 3, 16, 1, i <= k ? C.N : C.G);
    }
    for (const [f, id] of SIGNS) {
      const i = Math.round(Q.n * f), s = steps[i], y = sy(s.y);
      if (y > 0 && y < LH + 20) drawSign(id, s.x < LW / 2 ? s.x + 34 : s.x - 34, y);
    }
    // the watchtower at the top (2:1)
    const top = steps[Q.n], ty = sy(top.y);
    if (ty > -40) {
      R(top.x - 14, ty - 2, 28, 4, C.N);
      R(top.x - 12, ty - 30, 3, 28, C.N); R(top.x + 9, ty - 30, 3, 28, C.N);
      R(top.x - 14, ty - 34, 28, 4, C.N); for (let i = 0; i < 4; i++) R(top.x - 14 + i * 8, ty - 38, 4, 4, C.N);
      if (phase !== 'climb') alpha(0.3 + Math.sin(t * 3) * 0.1, () => circ(top.x, ty - 30, 26, C.Y));
    }
  }
  function drawProphet() {
    const s = steps[k];
    let x = s.x, y = sy(s.y), jumping = false;
    if (hop) {
      const a = steps[hop.from], f = clamp(hop.t / 0.11, 0, 1);
      x = lerp(a.x, s.x, f); y = Math.round(lerp(sy(a.y), sy(s.y), f) - Math.sin(f * Math.PI) * 6); jumping = f < 1;
    }
    const sh = stumble > 0 ? Math.round(Math.sin(stumble * 60)) : 0, face = (steps[k + 1] || s).x < x;
    spr(jumping ? SPR.habakkukJ : SPR.habakkuk, Math.round(x - 12 + sh), y - 32, face, 2);
  }

  return {
    init() {
      t = 0; build(); k = 0; hop = null; queue = []; breath = 0.8; slips = 0; streak = 0; cam = 0; phase = 'climb'; endT = 0; stumble = 0; deer = null; shown = {};
    },
    idle(dt) { t += dt; },
    update(dt) {
      t += dt; stumble = Math.max(0, stumble - dt);
      if (hop) { hop.t += dt; if (hop.t >= 0.11) { hop = null; if (queue.length) step(queue.shift()); } }
      if (deer) { deer.t += dt; if (deer.t > 1.4) deer = null; }
      cam += (steps[k].y - cam) * Math.min(1, dt * 8);
      if (phase === 'top') {
        endT += dt;
        if (endT > 0.9 && endT - dt <= 0.9) FX.float('하나님이 묵시를 판에 새기라 하셨어요', LW / 2, 30, C.Y, 7, 1.6);
        if (endT > 2.4 && endT - dt <= 2.4) FX.float('의인은 그의 믿음으로 말미암아 살리라', LW / 2, 46, C.w, 7, 1.8);
        if (endT > 4.0) {
          const stars = slips <= 1 ? 3 : slips <= 3 ? 2 : 1;
          Shell.finish(true, stars, slips === 0 ? `계단 ${Q.n}개를 한 번도 미끄러지지 않고 올랐어요` : `파수대에 올랐어요 · 미끄러진 것 ${slips}번`);
        }
        return;
      }
      if (AUTO && (autoT -= dt) <= 0 && !hop) { autoT = 0.16; const nx = steps[k + 1]; if (nx) step(Math.random() < 0.03 ? -nx.dir : nx.dir); }
      breath -= lerp(Q.drain[0], Q.drain[1], k / Q.n) * dt;
      if (breath <= 0) { breath = 0; Shell.finish(false, 0, '숨이 차서 파수대까지 오르지 못했어요'); return; }
      if (k >= Q.n && !hop) { phase = 'top'; endT = 0; sfx('good'); sfx('flash'); FX.flash(C.Y, 0.25); queue.length = 0; }
    },
    pointerDown(x) { step(x < LW / 2 ? -1 : 1); },
    keyDown(key) {
      if (key === 'ArrowLeft') { step(-1); return true; }
      if (key === 'ArrowRight') { step(1); return true; }
      return false;
    },
    draw(state) {
      drawBack(); drawSteps();
      if (deer) { const f = deer.t / 1.4, dx = deer.dir > 0 ? lerp(-20, LW + 20, f) : lerp(LW + 20, -20, f); spr(SPR.deer, Math.round(dx - 12), sy(deer.y) - 30 - Math.round(Math.abs(Math.sin(f * Math.PI * 4)) * 8), deer.dir < 0, 2); }
      drawProphet();
      if (state === 'ready' || (state === 'play' && k < 3 && phase === 'climb')) {
        TO('다음 계단이 있는 쪽을 눌러요', LW / 2, 30, C.w, 7, 'c');
        TO('◀ 왼쪽', 30, LH - 16, C.w, 7, 'c'); TO('오른쪽 ▶', LW - 30, LH - 16, C.w, 7, 'c');
      }
      hudBase();
      T('숨', 5, 3, C.c, 9);
      gauge(20, 6, 54, 4, breath, breath < 0.3 ? C.r : C.c);
      T(`${Math.min(k, Q.n)}/${Q.n}`, 158, 3, C.w, 9, 'r');
    }
  };
}

// ===================== 소선지서 5. 말라기의 곳간 (말라기 3장) =====================
// Bring the whole tithe into the storehouse (3:10): fit every offering into the storehouse with no gap left,
// then the windows of heaven open and pour out more blessing than there is room for.
function makeMalachi(diff) {
  const HARD = diff === 'h';
  const Q = HARD ? { cols: 5, rows: 6, cs: 14, time: 90, sizes: [2, 3, 3, 3, 4, 4] } : { cols: 4, rows: 5, cs: 16, time: 60, sizes: [2, 2, 3, 3, 3, 4] };
  const KINDS = [
    { base: C.n, dark: C.N, mark: 'sack' }, { base: C.y, dark: C.o, mark: 'jar' }, { base: C.v, dark: C.i, mark: 'grape' },
    { base: C.Y, dark: C.y, mark: 'sheaf' }, { base: C.l, dark: C.L, mark: 'fig' }, { base: C.w, dark: C.g, mark: 'wool' }
  ];
  let CS = Q.cs;
  let t, time, pieces, grab, occ, phase, endT, autoT = 0, autoI = 0;
  const gx0 = () => Math.round((LW - Q.cols * CS) / 2), gy0 = () => 44;

  function partition() {
    const n = Q.cols * Q.rows, owner = Array(n).fill(-1), groups = [];
    const nb = c => { const x = c % Q.cols, y = Math.floor(c / Q.cols), o = []; for (const [dx, dy] of [[1, 0], [0, 1], [-1, 0], [0, -1]]) { const a = x + dx, b = y + dy; if (a >= 0 && b >= 0 && a < Q.cols && b < Q.rows) o.push(b * Q.cols + a); } return o; };
    for (let i = 0; i < n; i++) {
      if (owner[i] >= 0) continue;
      const want = pick(Q.sizes), cells = [i]; owner[i] = groups.length;
      while (cells.length < want) {
        const cand = []; for (const c of cells) for (const j of nb(c)) if (owner[j] < 0) cand.push(j);
        if (!cand.length) break;
        const j = pick(cand); owner[j] = groups.length; cells.push(j);
      }
      groups.push(cells);
    }
    // fold single cells into a small neighbour so most offerings are at least two cells
    for (let g = 0; g < groups.length; g++) {
      if (groups[g].length !== 1) continue;
      const c = groups[g][0], to = nb(c).map(j => owner[j]).filter(o => o !== g && groups[o].length < 4).sort((a, b) => groups[a].length - groups[b].length)[0];
      if (to === undefined) continue;
      groups[to].push(c); owner[c] = to; groups[g] = [];
    }
    return groups.filter(g => g.length);
  }
  function setup() {
    const groups = shuffle(partition());
    pieces = groups.map((cells, i) => {
      const xs = cells.map(c => c % Q.cols), ys = cells.map(c => Math.floor(c / Q.cols)), mx = Math.min(...xs), my = Math.min(...ys);
      return { cells: cells.map(c => [c % Q.cols - mx, Math.floor(c / Q.cols) - my]), w: Math.max(...xs) - mx + 1, h: Math.max(...ys) - my + 1, sol: [mx, my], kind: KINDS[i % KINDS.length], at: null, x: 0, y: 0, hx: 0, hy: 0, back: 0 };
    });
    // lay the offerings out on the ground below the storehouse, bigger ones first; use the biggest cells that still fit
    const order = [...pieces].sort((a, b) => b.cells.length - a.cells.length || b.w - a.w);
    const gapX = 8, gapY = 7;
    const lay = cs => {
      let x = 6, y = gy0() + Q.rows * cs + 18, rowH = 0;
      for (const p of order) {
        if (x + p.w * cs > LW - 6) { x = 6; y += rowH + gapY; rowH = 0; }
        p.hx = x; p.hy = y; p.x = x; p.y = y; x += p.w * cs + gapX; rowH = Math.max(rowH, p.h * cs);
      }
      return y + rowH;
    };
    for (CS = 22; CS > 12 && lay(CS) > LH - 8; CS--);
    lay(CS);
    // centre each tray row
    const rows = new Map(); for (const p of pieces) { if (!rows.has(p.hy)) rows.set(p.hy, []); rows.get(p.hy).push(p); }
    for (const row of rows.values()) { const right = Math.max(...row.map(p => p.hx + p.w * CS)), shift = Math.floor((LW - 6 - right) / 2); for (const p of row) { p.hx += shift; p.x = p.hx; } }
    occ = Array(Q.cols * Q.rows).fill(null);
  }
  const hasCell = (p, cx, cy) => p.cells.some(([a, b]) => a === cx && b === cy);
  function pieceAt(x, y) {
    for (let i = pieces.length - 1; i >= 0; i--) { const p = pieces[i], cx = Math.floor((x - p.x) / CS), cy = Math.floor((y - p.y) / CS); if (hasCell(p, cx, cy)) return p; }
    return null;
  }
  function snapOf(p) {
    const gx = Math.round((p.x - gx0()) / CS), gy = Math.round((p.y - gy0()) / CS);
    for (const [a, b] of p.cells) { const x = gx + a, y = gy + b; if (x < 0 || y < 0 || x >= Q.cols || y >= Q.rows || (occ[y * Q.cols + x] && occ[y * Q.cols + x] !== p)) return null; }
    return [gx, gy];
  }
  function lift(p) {
    if (p.at) { for (const [a, b] of p.cells) occ[(p.at[1] + b) * Q.cols + p.at[0] + a] = null; p.at = null; }
    pieces.splice(pieces.indexOf(p), 1); pieces.push(p);
  }
  function drop(p) {
    const s = snapOf(p);
    if (s && Math.hypot(p.x - (gx0() + s[0] * CS), p.y - (gy0() + s[1] * CS)) < CS * 0.8) {
      p.at = s; p.x = gx0() + s[0] * CS; p.y = gy0() + s[1] * CS;
      for (const [a, b] of p.cells) occ[(s[1] + b) * Q.cols + s[0] + a] = p;
      sfx('clang');
      if (occ.every(Boolean)) { phase = 'bless'; endT = 0; sfx('good'); FX.float('온전한 십일조를 들였어요!', LW / 2, gy0() + Q.rows * CS + 12, C.Y, 9, 1.4); }
    } else { p.back = 0.18; sfx('thud'); }
  }

  // ---------- art ----------
  function drawPiece(p, ghost) {
    const k = p.kind, x0 = Math.round(p.x), y0 = Math.round(p.y);
    for (const [a, b] of p.cells) {
      const x = x0 + a * CS, y = y0 + b * CS;
      if (ghost) { R(x, y, CS, CS, ghost); continue; }
      R(x, y, CS, CS, k.base);
      if (!hasCell(p, a - 1, b)) R(x, y, 1, CS, k.dark);
      if (!hasCell(p, a + 1, b)) R(x + CS - 1, y, 1, CS, k.dark);
      if (!hasCell(p, a, b - 1)) R(x, y, CS, 1, k.dark);
      if (!hasCell(p, a, b + 1)) R(x, y + CS - 1, CS, 1, k.dark);
      const m = CS >> 1;
      if (k.mark === 'sack') { R(x + m - 2, y + 3, 4, 1, k.dark); R(x + m - 1, y + 4, 2, CS - 8, k.dark); }
      if (k.mark === 'jar') { R(x + m - 3, y + 3, 6, CS - 6, C.o); R(x + m - 2, y + 2, 4, 1, C.o); P(x + m - 2, y + 4, C.Y); }
      if (k.mark === 'grape') for (let i = 0; i < 5; i++) circ(x + 4 + (i % 3) * 3 + (i > 2 ? 1 : 0), y + 4 + (i > 2 ? 4 : 0), 1, C.i);
      if (k.mark === 'sheaf') for (let i = 3; i < CS - 2; i += 3) R(x + i, y + 2, 1, CS - 4, C.y);
      if (k.mark === 'fig') { circ(x + m, y + m, 3, C.L); P(x + m, y + m - 4, C.B); }
      if (k.mark === 'wool') { circ(x + m - 2, y + m, 2, C.g); circ(x + m + 2, y + m - 1, 2, C.g); }
    }
  }
  function drawStore() {
    const x0 = gx0(), y0 = gy0(), w = Q.cols * CS, h = Q.rows * CS;
    // the windows of heaven (3:10)
    const open = phase === 'bless' ? ease(endT / 0.8) : 0;
    R(LW / 2 - 24, 19, 48, 12, C.t);
    alpha(0.4 + open * 0.6, () => R(LW / 2 - 22, 20, 44, 10, C.Y));
    R(LW / 2 - 22, 20, Math.round(22 * (1 - open)), 10, C.i); R(LW / 2 + Math.round(22 * open), 20, Math.round(22 * (1 - open)), 10, C.i);
    // roof and walls of the storehouse
    for (let i = 0; i < 10; i++) R(x0 - 4 - i, y0 - 2 - 10 + i, w + 8 + i * 2, 1, i % 3 ? C.b : C.B);
    R(x0 - 3, y0 - 2, w + 6, h + 4, C.B);
    R(x0, y0, w, h, C.k);
    for (let c = 1; c < Q.cols; c++) R(x0 + c * CS, y0, 1, h, C.t);
    for (let r = 1; r < Q.rows; r++) R(x0, y0 + r * CS, w, 1, C.t);
  }

  return {
    init() { t = 0; time = Q.time; grab = null; phase = 'play'; endT = 0; autoI = 0; setup(); },
    idle(dt) { t += dt; },
    update(dt) {
      t += dt;
      for (const p of pieces) if (p.back > 0) { p.back -= dt; const f = Math.min(1, dt * 14); p.x += (p.hx - p.x) * f; p.y += (p.hy - p.y) * f; if (p.back <= 0) { p.x = p.hx; p.y = p.hy; } }
      if (phase === 'bless') {
        endT += dt;

        for (let i = 0; i < 6; i++) FX.part({ x: LW / 2 + rand(-20, 20), y: 30, vx: rand(-40, 40), vy: rand(30, 90), g: 160, life: 1.6, c: pick([C.Y, C.y, C.n, C.w]) });
        if (endT > 1.0 && endT - dt <= 1.0) FX.float('하늘 문을 열고', LW / 2, gy0() + Q.rows * CS + 26, C.w, 9, 1.2);
        if (endT > 2.0 && endT - dt <= 2.0) FX.float('쌓을 곳이 없도록 부어 주셨어요', LW / 2, gy0() + Q.rows * CS + 42, C.Y, 7, 1.4);
        if (endT > 3.4) {
          const f = time / Q.time, stars = f >= 0.45 ? 3 : f >= 0.2 ? 2 : 1;

        }
        return;
      }
      if (AUTO && (autoT -= dt) <= 0 && !grab) {
        autoT = 0.2;
        const p = pieces.find(q => !q.at || q.at[0] !== q.sol[0] || q.at[1] !== q.sol[1]);
        if (p) { const [a, b] = p.cells[0], px = p.x + a * CS + 2, py = p.y + b * CS + 2; this.pointerDown(px, py, 97); this.pointerMove(gx0() + (p.sol[0] + a) * CS + 2, gy0() + (p.sol[1] + b) * CS + 2, 97); this.pointerUp(0, 0, 97); }
      }
      time -= dt;
      if (time <= 0) { time = 0; Shell.finish(false, 0, '곳간을 다 채우지 못했어요'); }
    },
    pointerDown(x, y, id) {

      lift(p); p.back = 0; grab = { p, id, ox: x - p.x, oy: y - p.y }; sfx('pop');
    },
    pointerMove(x, y, id) { if (grab && grab.id === id) { grab.p.x = x - grab.ox; grab.p.y = y - grab.oy; } },
    pointerUp(x, y, id) { if (grab && grab.id === id) { const p = grab.p; grab = null; drop(p); } },
    release() { if (grab) { const p = grab.p; grab = null; drop(p); } },
    keyDown() { return false; },
    draw(state) {
      X.drawImage(layer('mal-bg', LW, LH - 17, () => {
        const h = LH - 17;
        vgrad(0, 0, LW, h * 0.55, [[0, C.c], [1, C.w]]);
        R(0, Math.round(h * 0.55), LW, h, C.b);
        const rr = prng(61); for (let i = 0; i < 50; i++) P(Math.floor(rr() * LW), Math.round(h * 0.55) + 2 + Math.floor(rr() * h * 0.45), C.B);
      }), 0, 17);
      drawStore();
      if (grab) { const s = snapOf(grab.p); if (s) alpha(0.35, () => drawPiece({ ...grab.p, x: gx0() + s[0] * CS, y: gy0() + s[1] * CS }, C.w)); }
      for (const p of pieces) drawPiece(p);
      if (state === 'ready' || (state === 'play' && t < 3 && !grab)) TO('예물을 끌어다 곳간을 빈틈없이 채워요', LW / 2, gy0() + Q.rows * CS + 7, C.w, 7, 'c');
      hudBase();
      const filled = occ.filter(Boolean).length;
      T('곳간', 5, 3, C.y, 9);
      gauge(32, 6, 52, 4, filled / occ.length, C.y);
      T(`${Math.ceil(time)}초`, 158, 3, time < 10 ? C.r : C.w, 9, 'r');
    }
  };
}
